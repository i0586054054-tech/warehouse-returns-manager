name: Sync learned products to Supabase

on:
  push:
    branches: [main]
    paths:
      - 'data/product_learning.json'
      - 'scripts/sync-product-learning.mjs'
      - '.github/workflows/sync-product-learning.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/sync-product-learning.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
